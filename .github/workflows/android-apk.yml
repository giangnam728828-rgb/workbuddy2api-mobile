name: android-apk

# 手机版：Go 内核交叉编译 → Gradle 打包成 APK。
#   - push 到 main / 手动触发：产出 APK，作为 artifact 可下载
#   - 打 v* tag：额外创建 Release 并附上 APK
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      # 不用 android-actions/setup-android：它会在 runner 预装的 SDK 上执行
      # `sdkmanager tools`（已废弃），在部分镜像上直接 exit 1。自己装一份固定版本更稳。
      - name: Install Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle（带缓存）
        uses: gradle/actions/setup-gradle@v3

      # Go 静态二进制 → jniLibs/<abi>/libwb2api.so（详见 android/build-go.sh 注释）
      - name: Build Go core for Android
        run: |
          chmod +x android/build-go.sh android/gradlew
          ./android/build-go.sh

      - name: Build APK
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/WorkBuddy2API-$(date +%Y%m%d).apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy2API-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
