name: android-apk

# 手机版：Go 内核交叉编译 → Gradle 打包成 APK。
#   - push 到 main / 手动触发：产出 APK，作为 artifact 可下载
#   - 打 v* tag：额外创建 Release 并附上 APK
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      # 不用 android-actions/setup-android：它会在 runner 预装的 SDK 上执行
      # `sdkmanager tools`（已废弃），在部分镜像上直接 exit 1。自己装一份固定版本更稳。
      - name: Install Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # yes 在被 sdkmanager 提前关掉管道时会拿到 SIGPIPE，pipefail 下会把整步判失败
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle（带缓存）
        uses: gradle/actions/setup-gradle@v3

      # Go 静态二进制 → jniLibs/<abi>/libwb2api.so（详见 android/build-go.sh 注释）
      - name: Build Go core for Android
        run: |
          chmod +x android/build-go.sh android/gradlew
          ./android/build-go.sh

      # 版本号：11300 + run_number，保证单调递增（部分 ROM 会按版本号拦覆盖安装）。
      # 签名：仓库内 android/keystore/wb2api.jks（固定证书），不是 debug/临时签名。
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease \
            -Pwb2apiVersionCode=$((11300 + VERSION_CODE)) \
            -Pwb2apiVersionName=1.13.1

      # 签名指纹断言：证书一旦被换掉（例如误用 debug key、keystore 丢失后重建），
      # 老用户就无法覆盖安装。这里直接让构建失败，比发出去再被用户发现好。
      - name: Verify signing certificate
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          BT="$ANDROID_HOME/build-tools/34.0.0"
          FPR=$("$BT/apksigner" verify --print-certs "$APK" \
                | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 \
                | tr -d ':' | tr 'A-Z' 'a-z')
          echo "APK: $APK"
          echo "签名 SHA-256: $FPR"
          EXPECT=b6ba56eed24b7385d4d5f290a2e89d5542b3b0c98814a0b33beb44cd1eb2e400
          if [ "$FPR" != "$EXPECT" ]; then
            echo "::error::签名指纹变了（$FPR != $EXPECT）：老用户将无法覆盖安装，请检查 android/keystore 与 gradle.properties"
            exit 1
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/WorkBuddy2API-1.13.1.apk"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy2API-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
